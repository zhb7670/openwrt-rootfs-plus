# =============================================================================
#  在 rootfs 里注入五项定制（不改 F大/海碧 的 rootfs，本地解包后注入，重打包）：
#    A. 预装 iStore 应用商店
#    B. 修复 iStore 在 ifit 主题下的侧边栏菜单（裸文字 → 有图标）
#    C. 修复 DDNS-GO 的 LuCI 菜单（官方 menu.d 架构在本固件上不显示）
#    D. 无线自愈：把旧配置里过期的 ffeXXXXX.sd 路径改成 ffeXXXXX.mmc
#    E. ifit 样式表加版本后缀，避免浏览器启发式缓存导致补丁"看起来没生效"
#
#  做法：
#    1. 下载 ophub 的 rootfs
#    2. 解到临时目录
#    3. 加入 iStore 软件源；把 6 个 ipk 原样放进 /usr/share/istore-bootstrap/
#    4. 写入 /etc/uci-defaults/ 钩子：首次启动时由目标系统自带的 opkg 真正安装
#    5.（可选）把 store.lua 菜单从 admin/store 挪到 admin/system/store
#    6. 给 ifit 主题补上 iStore 顶层菜单的图标与缩进（否则它在侧边栏是"裸文字"）
#    7. 预置 DDNS-GO 的老式 LuCI controller + view，并写入启用钩子
#    8. 写入 /etc/hotplug.d/ieee80211/05-wifi-path-fix（无线路径自愈）
#    9. 重新打包成 rootfs.tar.gz 交回 flippy 出固件
#
#  ⚠️ D 为什么放 hotplug.d 而不放 uci-defaults：
#    内核 6.x 把 Amlogic mmc 控制器的 sysfs 名从 ffe03000.sd 改成了 ffe03000.mmc。
#    从旧系统带过来的 /etc/config/wireless 里写死的老路径在新内核上永远匹配不到 phy
#    → radioN 报 "up": false, "retry_setup_failed": true；同时 10-wifi-detect 会以为
#    "这颗 phy 没人认领"，自动补一条 LEDE 开放网络顶上来，用户的 SSID 就消失了。
#    uci-defaults 在 /etc/init.d/boot 里执行得太早（SDIO 网卡还没枚举完，
#    /etc/config/wireless 往往还不存在），所以必须挂 hotplug 的 add 事件，
#    并且用 05 前缀排在 10-wifi-detect 之前，先修好再让 detect 判重。
#
#  ⚠️ E 的原因：uhttpd 只发 ETag / Last-Modified，**不发 Cache-Control / Expires**。
#    按 RFC 7234 §4.2.2 浏览器会做"启发式缓存"，有效期约 (缓存时刻 - Last-Modified)
#    × 10%。老 style.css 的 Last-Modified 是出厂日期，缓存一次能"新鲜"几十天，
#    期间不回服务器验证 → 补丁明明生效了，用户看到的还是旧界面。
#    给 <link ... style.css> 加一个随 CSS 内容变化的 ?v= 查询串即可彻底解决。
#
#  ⚠️ 关键历史教训（v1 的 bug，务必不要回退成"解包铺文件"）：
#    v1 用 `ar x` + `tar xzf data.tar.gz -C $ROOT` 直接把文件铺进 rootfs，
#    这**绕过了 opkg**，导致三个致命缺失：
#      a) 包没登记进 opkg 数据库 → is-opkg 自升级检测报 "Check version failed!"
#      b) Alternatives 不处理 → coreutils-stty 的 /bin/stty 是 opkg 建出来的软链，
#         data.tar.gz 里根本没有，所以 /bin/stty 永远不存在
#      c) 漏了 taskd 的两个运行时依赖 script-utils / coreutils-stty
#         → /usr/libexec/taskd 执行 `exec script ...` 报 "script: not found"
#         → 任何"点安装"都 exit 127 秒失败（这才是"点安装直接失败"的真正原因）
#    另外 v1 把 control.tar.gz 解到 $ROOT 根目录，循环覆盖后留下
#    /control /postinst /postinst-pkg /prerm /conffiles 一堆垃圾。
#
#  依赖链（必须完整，缺一不可）：
#    luci-app-store 0.2.1-r1
#      └─ luci-lib-taskd 1.0.26
#           ├─ luci-lib-xterm 4.18.0
#           └─ taskd 1.0.3-2
#                └─ script-utils（提供 /usr/bin/script）
#                └─ coreutils-stty（提供 /usr/libexec/stty-coreutils + /bin/stty 软链）
#
#  ⚠️ DDNS-GO 为什么也要改（不是坏了，是架构不匹配）：
#    rootfs 里 ddns-go(6.15.0-1) 与 luci-app-ddns-go(1.6.5) 其实都装好了，
#    但官方 luci-app-ddns-go 是"menu.d/*.json + resources/view/*.js"新架构，
#    而本固件的 createindex() 只扫 /usr/lib/lua/luci/controller/*.lua、不读 menu.d，
#    dispatcher.lua 也没有 view() 函数 → 官方菜单天生不出现。
#    解法：补一个老式 controller + 一个内嵌 ddns-go 自带 WebUI(:9876) 的 view，
#         并把 ddns-go 的 enabled 打开（默认关着 → 不建实例 → 9876 不监听）。
# =============================================================================
name: Package N1 & X96Max+ (with iStore + DDNS-GO)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "内核系列：单个写 6.18.y；要多个用下划线分隔，如 6.12.y_6.18.y（每个系列都自动取最新）"
        required: false
        default: "6.12.y_6.18.y"
      openwrt_ver:
        description: "固件版本号"
        required: false
        default: "R24.1.13"
      openwrt_ip:
        description: "默认 LAN IP"
        required: false
        default: "192.168.1.1"
      gzip_imgs:
        description: "镜像压缩方式"
        required: false
        default: "gz"
      istore_menu:
        description: "把 iStore 菜单从顶层挪到「系统」下面（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: istore-package
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: 打包固件（含 iStore）
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout（取本地化脚本与资源）
        uses: actions/checkout@v4

      - name: 安装依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y btrfs-progs dosfstools e2fsprogs util-linux uuid-runtime \
            fdisk parted gawk tar pigz p7zip-full rsync wget curl jq xz-utils

      - name: 准备依赖包（iStore + taskd + script-utils + coreutils-stty）
        run: |
          set -e
          mkdir -p pkg
          ISTORE="https://istore.istoreos.com/repo/all/store"
          LEDE_ROOT="https://mirrors.tencent.com/lede/releases/24.10.3/packages"
          LEDE_ARCH="aarch64_generic"

          # ① iStore 商店本体（Architecture: all，跨架构通用）
          for f in luci-app-store_0.2.1-r1_all.ipk \
                   taskd_1.0.3-2_all.ipk \
                   luci-lib-taskd_1.0.26_all.ipk \
                   luci-lib-xterm_4.18.0_all.ipk; do
            echo "下载 $f"
            curl -fSL --retry 3 "$ISTORE/$f" -o "pkg/$f"
          done

          # ② 上游官方依赖（taskd 运行时必需，v1 漏了 coreutils-stty）
          #    注意：Packages.gz 里的 Filename 是"相对本 feed 目录"的（如
          #    script-utils_2.40.2-r1_aarch64_generic.ipk），不带 base/ 前缀，
          #    所以拼 URL 时必须把 $feed 补回去。
          #    取不到包直接报错退出（v1 用 `|| true` 把失败吞掉了）。
          fetch() {
            feed="$1"; name="$2"
            meta=$(curl -fsSL "$LEDE_ROOT/$LEDE_ARCH/$feed/Packages.gz" | gunzip | \
                   awk -v n="$name" '$1=="Package:" && $2==n {p=1}
                                     p && $1=="Filename:" {fn=$2}
                                     p && $1=="SHA256sum:" {print fn" "$2; exit}')
            [ -n "$meta" ] || { echo "::error::在 $feed 索引里找不到包 $name"; exit 1; }
            fn=${meta%% *}; sum=${meta##* }
            fn=${fn#./}
            echo "下载 $name  <=  $feed/$fn"
            curl -fSL --retry 3 "$LEDE_ROOT/$LEDE_ARCH/$feed/$fn" -o "pkg/$(basename "$fn")"
            echo "$sum  pkg/$(basename "$fn")" | sha256sum -c -
          }
          fetch base     script-utils
          fetch packages coreutils-stty

          echo "===== 依赖包清单 ====="
          ls -lh pkg/
          [ "$(ls pkg/*.ipk | wc -l)" -eq 6 ] || { echo "::error::ipk 数量不是 6"; exit 1; }

      - name: 解包 rootfs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rel=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                 "https://api.github.com/repos/ophub/flippy-openwrt-actions/releases?per_page=30" \
               | jq -r '[.[] | select(.tag_name != "v0.1.0")
                        | {tag:.tag_name,
                           a:(.assets[]|select(.name|test("rootfs"))|{n:.name,u:.url})}
                        | select(.a != null)]
                    | sort_by(.a.n) | reverse | .[0]')
          url=$(echo "$rel" | jq -r '.a.u')
          name=$(echo "$rel" | jq -r '.a.n')
          echo "rootfs: $name"
          mkdir -p opt/download
          curl -fSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
               "$url" -o "opt/download/$name"
          echo "ROOTFS=$name" >> $GITHUB_ENV
          rm -rf rw && mkdir rw
          tar xzf "opt/download/$name" -C rw
          echo "解包完成，根目录："
          ls rw | head

      - name: 注入 iStore 软件源与预置 ipk
        run: |
          set -e
          ROOT=""
          for d in rw rw/*/; do
            if [ -f "$d/etc/opkg/distfeeds.conf" ]; then ROOT="$d"; break; fi
          done
          [ -n "$ROOT" ] || { echo "::error::未找到 rootfs 根目录（找 etc/opkg/distfeeds.conf）"; exit 1; }
          echo "rootfs 根目录: $ROOT"

          # 1) 追加 iStore 源
          echo "src/gz istore https://istore.istoreos.com/repo/all/store" \
            >> "$ROOT/etc/opkg/distfeeds.conf"

          # 2) 把 ipk 原样放进固件，交给首次启动的 opkg 安装
          #    （千万不要在这里解包铺文件，原因见文件头注释）
          mkdir -p "$ROOT/usr/share/istore-bootstrap"
          cp -v pkg/*.ipk "$ROOT/usr/share/istore-bootstrap/"
          ls -lh "$ROOT/usr/share/istore-bootstrap/"

      - name: 注入 DDNS-GO 的老式 LuCI 入口
        run: |
          set -e
          ROOT=""
          for d in rw rw/*/; do
            if [ -f "$d/etc/opkg/distfeeds.conf" ]; then ROOT="$d"; break; fi
          done
          [ -n "$ROOT" ] || { echo "::error::未找到 rootfs 根目录"; exit 1; }
          echo "rootfs 根目录: $ROOT"

          # 1) 预置静态文件（老式 controller + 内嵌 iframe 的 view）
          cp -av ddnsgo-luci/rootfs/. "$ROOT/"
          # 兜底：干掉可能混进来的 CRLF（CRLF 会让 Lua/shell 在设备上异常）
          find "$ROOT/usr/lib/lua/luci/controller/ddns-go.lua" "$ROOT/usr/lib/lua/luci/view/ddns-go" \
               -type f -exec sed -i 's/\r$//' {} +
          ls -l "$ROOT/usr/lib/lua/luci/controller/ddns-go.lua" \
                "$ROOT/usr/lib/lua/luci/view/ddns-go/ddns-go.htm"

          # 2) 顺手把 enabled 写进出厂 /etc/config/ddns-go（双保险，钩子里还会再压一次）
          if [ -f "$ROOT/etc/config/ddns-go" ]; then
            if grep -qE "^\s*option\s+enabled\s" "$ROOT/etc/config/ddns-go"; then
              sed -i -E "s/^(\s*option\s+enabled\s+).*/\1'1'/" "$ROOT/etc/config/ddns-go"
            else
              sed -i -E "s/^(\s*option\s+dns\s+.*)$/\1\n\toption enabled '1'/" "$ROOT/etc/config/ddns-go"
            fi
            echo "----- /etc/config/ddns-go -----"
            cat "$ROOT/etc/config/ddns-go"
          else
            echo "::warning::rootfs 里没有 /etc/config/ddns-go（ddns-go 包可能不在这个 rootfs）"
          fi

      - name: 写入首次启动钩子（uci-defaults）
        run: |
          set -e
          ROOT=""
          for d in rw rw/*/; do
            if [ -f "$d/etc/opkg/distfeeds.conf" ]; then ROOT="$d"; break; fi
          done
          [ -n "$ROOT" ] || { echo "::error::未找到 rootfs 根目录"; exit 1; }
          echo "rootfs 根目录: $ROOT"

          mkdir -p "$ROOT/etc/uci-defaults"
          install -m 0755 istore-bootstrap/05-istore-bootstrap "$ROOT/etc/uci-defaults/05-istore-bootstrap"
          # 96 必须在 95 之后、99 之前：先挪菜单（可选），再补 ifit 的 iStore 图标，最后清缓存
          install -m 0755 istore-bootstrap/96-istore-menu-icon "$ROOT/etc/uci-defaults/96-istore-menu-icon"
          # zz- 开头：uci-defaults 按字母序执行，zz 排最后，保证压过 ddns-go 包自带的 luci-ddns-go
          install -m 0755 ddnsgo-luci/zz-ddnsgo-luci "$ROOT/etc/uci-defaults/zz-ddnsgo-luci"
          install -m 0755 istore-bootstrap/99-luci-refresh   "$ROOT/etc/uci-defaults/99-luci-refresh"

          # 98 必须在 96 之后（这时 style.css 已经打过补丁，mtime 才是对的）、99 之前
          install -m 0755 system-fixes/98-ifit-css-cachebust "$ROOT/etc/uci-defaults/98-ifit-css-cachebust"

          # 无线路径自愈放 hotplug.d 而不放 uci-defaults：
          # uci-defaults 在 /etc/init.d/boot 里跑得太早，那时 SDIO 网卡还没枚举完、
          # /etc/config/wireless 往往还不存在。hotplug 的 add 事件才是网卡刚上线的时刻，
          # 而且 05 排在 10-wifi-detect 之前，修完再让 detect 去判重，就不会多补一个 radio。
          mkdir -p "$ROOT/etc/hotplug.d/ieee80211"
          install -m 0755 system-fixes/05-wifi-path-fix "$ROOT/etc/hotplug.d/ieee80211/05-wifi-path-fix"

          if [ "${{ inputs.istore_menu }}" = "true" ]; then
            echo "启用：把 iStore 菜单挪到「系统」下面"
            install -m 0755 istore-bootstrap/95-istore-menu-move "$ROOT/etc/uci-defaults/95-istore-menu-move"
          else
            echo "保持 iStore 菜单原样（admin/store 顶层）"
          fi

          echo "===== uci-defaults 内容 ====="
          ls -l "$ROOT/etc/uci-defaults/"
          echo "===== 无线自愈钩子 ====="
          ls -l "$ROOT/etc/hotplug.d/ieee80211/"

          # 兜底：所有首启钩子必须是 LF，否则 #!/bin/sh\r 在设备上直接失效
          for f in "$ROOT"/etc/uci-defaults/* "$ROOT"/etc/hotplug.d/ieee80211/05-wifi-path-fix; do
            sed -i 's/\r$//' "$f"
          done
          echo "----- shebang 字节检查（应为 #!/bin/sh + LF）-----"
          head -c 12 "$ROOT/etc/uci-defaults/05-istore-bootstrap" | od -c
          head -c 12 "$ROOT/etc/hotplug.d/ieee80211/05-wifi-path-fix" | od -c

          echo "----- 05-istore-bootstrap -----"
          cat "$ROOT/etc/uci-defaults/05-istore-bootstrap"

      - name: 重新打包 rootfs
        run: |
          set -e
          ROOT=""
          for d in rw rw/*/; do
            if [ -f "$d/etc/opkg/distfeeds.conf" ]; then ROOT="$d"; break; fi
          done
          [ -n "$ROOT" ] || { echo "::error::未找到 rootfs 根目录"; exit 1; }
          echo "rootfs 根目录: $ROOT"
          OUT="opt/download/$ROOTFS"
          rm -f "$OUT"
          tar czf "$OUT" -C "$ROOT" .
          ls -lh "$OUT"

      - name: 调用 F大脚本打包固件
        id: package
        env:
          OPENWRT_ARMSR: opt/download/${{ env.ROOTFS }}
          PACKAGE_SOC: s905x3_s905d
          KERNEL_REPO_URL: ophub/kernel
          KERNEL_VERSION_NAME: ${{ inputs.kernel_version }}
          KERNEL_AUTO_LATEST: 'true'
          OPENWRT_IP: ${{ inputs.openwrt_ip }}
          GZIP_IMGS: ${{ inputs.gzip_imgs }}
          WHOAMI: Haiibo
        run: |
          set -o pipefail
          chmod -R +x flippy-vendor/openwrt_flippy.sh flippy-vendor/openwrt_packit/files 2>/dev/null || true
          rm -rf openwrt_packit && cp -r flippy-vendor/openwrt_packit openwrt_packit
          cp "opt/download/$ROOTFS" "openwrt_packit/openwrt-armsr-armv8-generic-rootfs.tar.gz"
          bash flippy-vendor/openwrt_flippy.sh

      - name: 收集产物
        run: |
          mkdir -p firmware
          cp -v "${PACKAGED_OUTPUTPATH}"/*.img.gz firmware/ 2>/dev/null || true
          [ -z "$(ls -A firmware 2>/dev/null)" ] && { echo "::error::无产出"; exit 1; }
          cd firmware
          # 保留上游原始文件名（含 -flippy-95+o / -flippy-95+ 变体标记）：
          # 「+o」和「+」是两支不同内核变体，改名会把这个信息抹掉，看起来四份一模一样。
          echo "===== 镜像清单（上游原名，含 +o / + 变体标记）====="
          for f in *.img.gz; do [ -e "$f" ] || continue; echo "  $f"; done
          sha256sum ./*.img.gz > sha256sums.txt 2>/dev/null || true
          ls -lh

      - name: 发布
        uses: ncipollo/release-action@v1
        with:
          tag: N1-X96MaxPlus-iStore
          name: "OpenWrt for N1 & X96Max+（含 iStore + DDNS-GO）"
          allowUpdates: true
          removeArtifacts: true
          artifacts: firmware/*
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### 本次打包
            - 基于 F大官方 rootfs（ophub/flippy-openwrt-actions 月度存档）
            - 内核：`${{ inputs.kernel_version }}`（ophub/kernel；
              `x.y.y` 表示自动取该系列最新，多个系列用 `_` 分隔）
            - 机型：`s905d`=斐讯N1；`s905x3`=X96Max+/HK1/H96MaxX3/TX3
            - **产物 = 机型 × 内核系列**：本次为 2 机型 × 2 内核系列 = **4 个镜像**，
              **四个镜像都已注入下面五项定制**（注入发生在 rootfs 层，所有镜像共用同一份 rootfs）
            - **文件名保留上游原始命名**，末尾的 `-flippy-95+o` / `-flippy-95+` 是两支不同的
              内核变体：**`+o` 偏稳、`+` 偏新**（flippy 的两支构建，官方未正式定义，
              社区资料通常说 `+o` 更稳、N1 等盒子更推荐）
                同一内核系列下：`…k6.12.112-flippy-95+o.img.gz`（带 o）
                              `…k6.18.56-flippy-95+.img.gz`（不带 o）

            ### 已注入的五项定制

            **① iStore 安装方式（已修正）**
            iStore 不再"解包铺文件"，而是把 6 个官方 ipk 预置到
            `/usr/share/istore-bootstrap/`，**首次开机由系统自带的 opkg 真正安装**。
            完整依赖链：`script-utils` + `coreutils-stty` → `taskd` → `luci-lib-taskd`
            → `luci-lib-xterm` → `luci-app-store`。
            这样 `/bin/stty` 软链、opkg 数据库登记、首次初始化脚本都会正确执行，
            「点安装插件」不会再秒失败。
            首次开机日志见 `/tmp/istore-bootstrap.log`。

            **② iStore 菜单外观（ifit 主题）**
            ifit 的侧边栏图标是**按 `data-title` 硬编码**在 `style.css` 里的，而
            iStore 是全菜单里唯一"没有子菜单的顶层项"，不在那张表里 —— 结果就是
            无图标、文字贴最左边，与其它菜单不协调。
            现由 `/etc/uci-defaults/96-istore-menu-icon` 在首次开机自动补上
            （照抄主题中 Logout 的同款写法，图标取 icomoon `\e903` extension）。

            **③ DDNS-GO 的 LuCI 菜单**
            rootfs 里 `ddns-go(6.15.0-1)` 与 `luci-app-ddns-go(1.6.5)` 其实都装好了，
            但官方 App 用的是 `menu.d/*.json + resources/view/*.js` 新架构，
            而本固件的 `createindex()` 只扫 `controller/*.lua`、不读 menu.d，
            `dispatcher.lua` 也没有 `view()` → 菜单**天生不出现**（不是坏了）。
            现预置一个老式 `controller/ddns-go.lua` + 内嵌 ddns-go 自带 WebUI(:9876)
            的 `view/ddns-go/ddns-go.htm`，并由 `/etc/uci-defaults/zz-ddnsgo-luci`
            在首次开机把 `ddns-go.config.enabled` 打开、设为开机自启。
            刷完后菜单路径：**服务 → DDNS-GO**。

            **④ 无线路径自愈（换内核后 WiFi 掉线的根因）**
            内核 6.x 把 Amlogic mmc 控制器的 sysfs 名改过：
            `6.1.x` 是 `platform/soc/ffe03000.sd/...`，`6.18.x` 是 `platform/soc/ffe03000.mmc/...`。
            如果 `/etc/config/wireless` 是从旧系统带过来的（恢复配置备份），里面写死的老路径
            在新内核上**永远匹配不到 phy** → `radioN` 报 `"up": false, "retry_setup_failed": true`；
            同时 `10-wifi-detect` 会以为"这颗 phy 没人认领"，自动补一条 `LEDE` 开放网络顶上来
            —— 表现就是"我的 WiFi 不见了，多了个不认识的网络"。
            现由 `/etc/hotplug.d/ieee80211/05-wifi-path-fix` 在网卡上线时把
            `ffeXXXXX.sd/` 批量改成 `ffeXXXXX.mmc/`，并在 `radio1` 与 `radio0` 同路径时删掉 `radio1`。
            放 `hotplug.d` 而非 `uci-defaults`：后者在 `/etc/init.d/boot` 里跑得太早，
            那时 SDIO 网卡还没枚举完、`/etc/config/wireless` 往往还不存在。

            **⑤ ifit 样式表版本后缀（补丁"看起来没生效"的根因）**
            uhttpd 只发 `ETag` / `Last-Modified`，**不发 `Cache-Control` / `Expires`**。
            按 RFC 7234 §4.2.2，浏览器会对这类响应做"启发式缓存"，有效期约
            `(缓存时刻 − Last-Modified) × 10%`。老 `style.css` 的 `Last-Modified` 是出厂日期，
            缓存一次能"新鲜"几十天，**期间根本不回服务器验证** —— 于是 ② 的图标补丁明明生效了，
            浏览器里看到的还是旧界面（按 `Ctrl+Shift+R` 强刷一次才能看到）。
            现由 `/etc/uci-defaults/98-ifit-css-cachebust` 给 `header.htm` 里的
            `<link ... style.css>` 加上 `?v=<css 的 mtime>`，URL 一变浏览器必然重拉。

            ### iStore 菜单位置
            默认保持 iStore 上游原样（`admin/store`，显示在侧边栏顶层）。
            需要挪到「系统」下面时，重新触发 workflow 并把 `istore_menu` 设为 `true`。
